<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3f8f" />
  <title>עיר הבטיחות – סיור תלת-ממדי</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- loading / start screen -->
  <div id="loader" class="overlay">
    <div class="card">
      <div class="logo">🚦</div>
      <h1>עיר הבטיחות</h1>
      <p class="sub">סיור תלת-ממדי בעיר שלנו</p>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="load-text" class="small">טוען את העיר…</p>
      <button id="start" class="big-btn" hidden>יוצאים לסיור ▶</button>
    </div>
  </div>

  <!-- intro title -->
  <div id="intro-title" hidden>
    <h1>עיר הבטיחות</h1>
    <p>ברוכים הבאים! בואו נכיר את הרחובות, הרמזורים ומעברי החציה</p>
  </div>
  <button id="skip" class="pill" hidden>דלג ›</button>

  <!-- explore HUD -->
  <div id="hud" hidden>
    <div class="topbar">
      <div class="brand">🚦 עיר הבטיחות</div>
      <div class="signal" title="מצב הרמזור בצומת">
        <span class="lamp r" id="sig-r"></span><span class="lamp y" id="sig-y"></span><span class="lamp g" id="sig-g"></span>
      </div>
    </div>
    <nav id="views" class="views"></nav>
    <div class="tools">
      <button id="btn-mute" class="tool" aria-label="השתקה">🔊</button>
      <button id="btn-quality" class="tool wide" aria-label="איכות גרפיקה">איכות: גבוהה</button>
      <button id="btn-intro" class="tool" aria-label="הפעלת הפתיח מחדש">🎬</button>
      <button id="btn-full" class="tool" aria-label="מסך מלא">⛶</button>
    </div>
    <div id="hint" class="hint">גררו לסיבוב • צביטה או גלגלת לזום • שתי אצבעות להזזה • הקשה כפולה להתקרבות</div>
  </div>

  <div id="dev" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
